# Источник правды для CI (копия для документации).
# Рабочий workflow GitHub Actions: /.github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: |
          if compgen -G "main/backend/**/*.py" > /dev/null; then
            ruff check main/backend --config deploy/lint/ruff.toml
            ruff format main/backend --check --config deploy/lint/ruff.toml
          else
            echo "No Python sources yet — skip"
          fi

  lint-frontend:
    name: Lint Frontend (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ESLint
        working-directory: main/frontend
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint
          else
            echo "No frontend package.json yet — skip"
          fi

  test-python:
    name: Pytest
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          if [ -f main/backend/requirements.txt ]; then
            pip install -r main/backend/requirements.txt
          fi
          pip install pytest
      - name: Run tests
        run: |
          if compgen -G "test/**/*.py" > /dev/null || compgen -G "main/backend/**/test_*.py" > /dev/null; then
            pytest -q
          else
            echo "No tests yet — skip"
          fi
