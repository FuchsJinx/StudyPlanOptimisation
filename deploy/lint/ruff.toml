# Ruff — lint + format для Python backend
# https://docs.astral.sh/ruff/

target-version = "py312"
line-length = 100
src = ["main/backend"]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
]
ignore = [
  "E501",  # line length — контролируется formatter
]

[lint.isort]
known-first-party = ["app", "services", "parsers", "db"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
